        { type: "D", typeName: "?? 타인 정보 존중 & 저작권/초상권", situation: '유튜브 촬영 중 길거리에서 지나가는 사람들의 얼굴이 화면에 선명하게 찍혔습니다.', optA: "모자이크 처리 없이 바로 유튜브에 업로드한다.", optB: "타인의 초상권을 위해 동의 없는 얼굴은 모자이크/블러 처리 후 올린다.", correct: "B", penalty: 2, reason: "동의 없이 남의 얼굴을 인터넷에 공개하면 초상권 침해가 돼요!" },
        { type: "D", typeName: "?? 타인 정보 존중 & 저작권/초상권", situation: '친구의 핸드폰에 적혀 있는 비밀 메모장을 몰래 열어보았습니다.', optA: "무슨 내용인지 궁금하니까 읽고 내 폰으로 찍어둔다.", optB: "타인의 사생활 및 개인 기록이므로 보지 않고 덮는다.", correct: "B", penalty: 2, reason: "친구의 메모장이나 일기는 개인의 사생활이므로 절대로 몰래 읽거나 촬영하면 안 돼요!" },
        { type: "D", typeName: "?? 타인 정보 존중 & 저작권/초상권", situation: '블로그에서 멋진 그림을 발견했습니다. 내 SNS 프로필 사진으로 쓰고 싶습니다.', optA: "그냥 출처도 안 적고 다운받아서 내 프로필로 쓴다.", optB: "원작자에게 사용 가능 여부를 물어보거나 저작권 무료 이미지를 이용한다.", correct: "B", penalty: 1, reason: "타인의 작품을 허락 없이 퍼다 사용하는 것은 저작권 침해 행동입니다!" },

        { type: "E", typeName: "?? 칭찬 & 회복 카드", situation: '스마트폰 백신 프로그램으로 악성코드 정밀 검사를 실시했습니다.', optA: "안전한 디지털 생활 실천!", optB: "귀찮아서 백신 프로그램을 끄고 검사하지 않는다.", correct: "A", bonus: 1, reason: "주기적인 백신 검사는 악성코드를 막아줍니다. 보너스 칩 1개를 얻었습니다! ??" },
        { type: "E", typeName: "?? 칭찬 & 회복 카드", situation: '사용하지 않는 게임 앱과 사이트에서 회원 탈퇴를 하고 계정을 정리했습니다.', optA: "사용하지 않는 개인정보를 스스로 보호했습니다!", optB: "탈퇴하기 귀찮으니 쓰지 않는 계정도 방치해둔다.", correct: "A", bonus: 1, reason: "쓰지 않는 계정을 정리하면 개인정보 유출 위험을 줄여줘요. 보너스 칩 1개 획득! ??" },

    // 게임 상태 변수
    let currentChips = 10;
    let currentCardIndex = 0;
    let chanceCount = 2;
    let gameCards = [];

    // 게임 시작 및 초기화
    function initGame() {
        currentChips = 10;
        currentCardIndex = 0;
        chanceCount = 2;
        gameCards = [...rawCardData].sort(() => Math.random() - 0.5); // 카드 랜덤 섞기

        document.getElementById("game-screen").style.display = "block";
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("chance-btn").disabled = false;
        
        updateHeaderStats();
        renderCurrentCard();
    }

    // 헤더 상태 정보 갱신
    function updateHeaderStats() {
        document.getElementById("chip-count").innerText = currentChips;
        document.getElementById("current-card").innerText = currentCardIndex + 1;
        document.getElementById("chance-count").innerText = chanceCount;
    }

    // 현재 카드 화면에 그리기
    function renderCurrentCard() {
        if (currentCardIndex >= gameCards.length || currentChips <= 0) {
            endGame();
            return;
        }

        const card = gameCards[currentCardIndex];
        
        // 카드 타입 표시 스타일
        const typeBadge = document.getElementById("card-type");
        typeBadge.innerText = card.typeName;
        typeBadge.className = "card-type type-" + card.type.toLowerCase();

        document.getElementById("card-situation").innerText = card.situation;
        document.getElementById("option-a").innerText = card.optA;
        document.getElementById("option-b").innerText = card.optB;
        
        updateHeaderStats();
    }

    // 선택지 클릭 처리
    function selectOption(userChoice) {
        const card = gameCards[currentCardIndex];
        const isCorrect = (userChoice === card.correct);

        if (isCorrect) {
            if (card.type === "E") { // 칭찬/회복 카드
                currentChips += (card.bonus || 1);
                showModal("success", "?? 보너스 칩 획득!", card.reason, "??");
            } else {
                showModal("success", "??? 개인정보 지킴 성공!", "훌륭한 선택입니다! 칩을 안전하게 지켰습니다.", "?");
            }
        } else {
            // 오답 처리
            document.body.classList.add("warning-mode");
            
            if (card.type === "E") {
                showModal("warning", "?? 아쉬운 선택!", "안전 수칙을 지키지 않아 보너스 칩을 얻지 못했어요.", "??");
            } else {
                const penalty = card.penalty || 2;
                currentChips -= penalty;
                if (currentChips < 0) currentChips = 0;
                
                showModal("warning", `?? 경고! 칩 ${penalty}개 차감!`, card.reason, "??");
            }
        }
    }

    // 부모님/선생님 찬스 사용
    function useChance() {
        if (chanceCount > 0) {
            chanceCount--;
            document.getElementById("chance-count").innerText = chanceCount;
            if (chanceCount === 0) {
                document.getElementById("chance-btn").disabled = true;
            }
            showModal("success", "???♂? 찬스 사용 완료!", "어른에게 알리는 것이 가장 안전한 정답입니다! 칩을 잃지 않고 통과합니다.", "??");
        }
    }

    // 피드백 모달 표시
    function showModal(status, title, desc, icon) {
        const modal = document.getElementById("modal");
        const overlay = document.getElementById("modal-overlay");
        
        modal.className = (status === "success") ? "modal success" : "modal";
        document.getElementById("modal-icon").innerText = icon;
        document.getElementById("modal-title").innerText = title;
        document.getElementById("modal-desc").innerText = desc;

        overlay.classList.add("active");
    }

    // 모달 닫기 및 다음 카드로 이동
    function closeModal() {
        document.getElementById("modal-overlay").classList.remove("active");
        document.body.classList.remove("warning-mode");
        
        currentCardIndex++;
        renderCurrentCard();
    }

    // 게임 종료 및 보안 등급 수여
    function endGame() {
        document.getElementById("game-screen").style.display = "none";
        document.getElementById("result-screen").style.display = "block";

        const badgeIcon = document.getElementById("badge-icon");
        const resultGrade = document.getElementById("result-grade");
        const resultDesc = document.getElementById("result-desc");

        let badge, grade, desc;

        if (currentChips >= 9) {
            badge = "??";
            grade = "보안 마스터";
            desc = `최종 남은 칩: <b>${currentChips}개</b><br>"인터넷 세상의 철통 방어막!" 완벽한 개인정보 보안관입니다.`;
        } else if (currentChips >= 6) {
            badge = "???";
            grade = "보안 가드";
            desc = `최종 남은 칩: <b>${currentChips}개</b><br>"상당히 안전하지만 조금 더 주의해요!" 뛰어난 방어 능력이에요.`;
        } else if (currentChips >= 3) {
            badge = "??";
            grade = "보안 주의보";
            desc = `최종 남은 칩: <b>${currentChips}개</b><br>"개인정보가 위험에 노출되고 있어요!" 수칙을 다시 확인해보세요.`;
        } else {
            badge = "??";
            grade = "보안 위기";
            desc = `최종 남은 칩: <b>${currentChips}개</b><br>"해커의 표적이 되기 쉬워요!" 다시 도전해서 칩을 지켜보세요.`;
        }

        badgeIcon.innerText = badge;
        resultGrade.innerText = grade;
        resultDesc.innerHTML = desc;
    }

    // 재시작
    function restartGame() {
        initGame();
    }

    // 페이지 로드시 자동 실행
    window.onload = initGame;
</script>
